[workspace]
members = [
    "crates/krun-sys",
    "crates/microvm-core",
    "crates/microvm-runner",
    "crates/microvm-cli",
    "crates/libgvproxy-sys",
    "crates/containerd-shim-krun",
    "crates/krun-operator",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sangam Biradar <sangam14@users.noreply.github.com>"]
license = "Apache-2.0"

[workspace.dependencies]
libgvproxy-sys = { path = "crates/libgvproxy-sys" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.29", features = ["signal", "process", "term"] }
libc = "0.2"
tempfile = "3.10"
bytes = "1.6"
oci-spec = "0.10"
containerd-shim = { version = "0.11", features = ["async"] }
containerd-shim-protos = { version = "0.11" }
ttrpc = { version = "0.9", features = ["async"] }
async-trait = "0.1"
kube = { version = "4.2", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
schemars = "1"
futures = "0.3"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0
debug = true

