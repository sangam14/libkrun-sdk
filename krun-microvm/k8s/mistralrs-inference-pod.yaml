apiVersion: v1
kind: Pod
metadata:
  name: mistralrs-inference
  labels:
    app: mistralrs-inference
spec:
  runtimeClassName: krun
  containers:
    - name: mistralrs
      image: ghcr.io/ericlbuehler/mistral.rs:cpu-latest
      command:
        - "mistralrs-server"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "1234"
        - "plain"
        - "-m"
        - "mistralai/Mistral-7B-Instruct-v0.2"
        - "--isq"
        - "Q4K"
      ports:
        - containerPort: 1234
          name: http-inference
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: token
              optional: true
      resources:
        limits:
          cpu: "4"
          memory: "8Gi"
        requests:
          cpu: "2"
          memory: "4Gi"
      volumeMounts:
        - name: model-cache
          mountPath: /models
  volumes:
    - name: model-cache
      emptyDir: {}
