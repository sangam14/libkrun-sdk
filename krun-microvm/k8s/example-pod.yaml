apiVersion: v1
kind: Pod
metadata:
  name: microvm-demo
  labels:
    app: microvm-demo
spec:
  runtimeClassName: krun
  containers:
    - name: secure-workload
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== Hello from inside a libkrun microVM Pod! ==="
          uname -a
          cat /proc/cpuinfo | grep "model name\|processor" | head -n 4
          echo "Hardware virtualization boundary active."
          while true; do sleep 3600; done
      resources:
        limits:
          cpu: "1"
          memory: "256Mi"
        requests:
          cpu: "250m"
          memory: "128Mi"
