# containerd configuration snippet for libkrun microVM runtime
# Add this section to /etc/containerd/config.toml

version = 2

[plugins."io.containerd.grpc.v1.cri"]
  [plugins."io.containerd.grpc.v1.cri".containerd]
    default_runtime_name = "runc"

    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes]
      # Standard runc runtime for regular containers
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"

      # Hardware-isolated microVM runtime powered by libkrun
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.krun]
        runtime_type = "io.containerd.krun.v2"
        runtime_engine = ""
        runtime_root = ""
        privileged_without_host_devices = false

        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.krun.options]
          # Path to the shim binary (or ensures it's found in $PATH)
          BinaryName = "/usr/local/bin/containerd-shim-krun-v2"
